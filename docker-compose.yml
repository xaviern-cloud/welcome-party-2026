services:
  app:
    build: .
    container_name: wp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - wp_network

  nginx:
    image: nginx:alpine
    container_name: wp_nginx
    restart: unless-stopped
    ports:
      - "8080:80" # Expose ke port 8080 (nanti di-proxy ke domain/HTTPS)
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wp_network

  db:
    image: mysql:8.0
    container_name: wp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: welcome_party
      MYSQL_ROOT_PASSWORD: PasswordRahasiaKuat123!
    volumes:
      - wp_dbdata:/var/lib/mysql
    networks:
      - wp_network

networks:
  wp_network:
    driver: bridge

volumes:
  wp_dbdata:
